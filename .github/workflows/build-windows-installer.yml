name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean OurDay.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\OurDay.iss"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OurDay-Windows-Installer
          path: installer-dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: installer-dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: Our Day ${{ github.ref_name }}
          make_latest: true
