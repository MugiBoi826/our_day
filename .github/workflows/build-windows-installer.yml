name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean OurDay.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\OurDay.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: OurDay-Windows-Installer
          path: installer-dist/*.exe
